# Runs the backend tests (5.12) against a real PostgreSQL on every pull request
# and on every push to main that touches the backend.
name: Backend tests

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campusslot
          POSTGRES_PASSWORD: campusslot
          POSTGRES_DB: campusslot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campusslot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database inside the CI container; these are not real credentials.
      DATABASE_URL: postgresql://campusslot:campusslot@localhost:5432/campusslot_test?schema=public
      DATABASE_URL_TEST: postgresql://campusslot:campusslot@localhost:5432/campusslot_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
